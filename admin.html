<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cozy Café | Admin Dashboard</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f1e9;
            color: #2b1a12;
        }


        button,
        select {
            font: inherit;
        }


        button {
            cursor: pointer;
        }


        .layout {
            min-height: 100vh;
            display: flex;
        }


        /* ========================================
           SIDEBAR
        ======================================== */

        .sidebar {
            width: 260px;
            background: #2d1a11;
            color: white;
            padding: 30px 20px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
        }


        .brand {
            font-family: Georgia, serif;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 45px;
            padding-left: 10px;
        }


        .brand span {
            color: #d49450;
        }


        .nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }


        .nav button {
            border: 0;
            background: transparent;
            color: white;
            text-align: left;
            padding: 15px 18px;
            border-radius: 12px;
            font-size: 16px;
        }


        .nav button:hover,
        .nav button.active {
            background: #b87333;
        }


        .logout {
            position: absolute;
            left: 20px;
            right: 20px;
            bottom: 25px;
        }


        .logout button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #c94f4f;
            color: white;
            font-weight: bold;
        }


        /* ========================================
           MAIN
        ======================================== */

        .main {
            margin-left: 260px;
            width: calc(100% - 260px);
            padding: 35px;
        }


        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }


        .topbar h1 {
            font-family: Georgia, serif;
            font-size: 38px;
        }


        .topbar p {
            margin-top: 6px;
            color: #765f50;
        }


        .admin-badge {
            background: white;
            padding: 15px 22px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(50, 30, 10, 0.08);
        }


        /* ========================================
           SECTIONS
        ======================================== */

        .section {
            display: none;
        }


        .section.active {
            display: block;
        }


        /* ========================================
           STATS
        ======================================== */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }


        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(50, 30, 10, 0.08);
        }


        .stat-icon {
            font-size: 30px;
            margin-bottom: 15px;
        }


        .stat-card small {
            color: #765f50;
            font-weight: bold;
            text-transform: uppercase;
        }


        .stat-card strong {
            display: block;
            font-size: 34px;
            margin-top: 8px;
        }


        /* ========================================
           CARD
        ======================================== */

        .card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(50, 30, 10, 0.08);
        }


        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }


        .card-header h2 {
            font-family: Georgia, serif;
        }


        .refresh-btn {
            border: 0;
            background: #8b572a;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
        }


        /* ========================================
           TABLE
        ======================================== */

        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }


        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }


        th {
            background: #f3eadf;
            text-align: left;
            padding: 14px;
            font-size: 14px;
        }


        td {
            padding: 14px;
            border-bottom: 1px solid #eadbca;
            vertical-align: middle;
        }


        tr:hover td {
            background: #fffaf4;
        }


        /* ========================================
           STATUS
        ======================================== */

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }


        .status.Pending {
            background: #fff1c7;
            color: #8a6200;
        }


        .status.Confirmed {
            background: #dff4df;
            color: #267326;
        }


        .status.Preparing {
            background: #dcecff;
            color: #225c9b;
        }


        .status.Ready {
            background: #e8dcff;
            color: #6842a5;
        }


        .status.Completed {
            background: #d9f4e9;
            color: #18704e;
        }


        .status.Cancelled {
            background: #ffdede;
            color: #a52c2c;
        }


        select {
            border: 1px solid #dbc8b5;
            padding: 8px;
            border-radius: 8px;
            background: white;
        }


        /* ========================================
           EMPTY / ERROR
        ======================================== */

        .message {
            text-align: center;
            padding: 30px;
            color: #765f50;
        }


        .error {
            background: #ffe1e1;
            color: #a52c2c;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }


        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 1000px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

        }


        @media (max-width: 700px) {

            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }


            .layout {
                display: block;
            }


            .main {
                margin-left: 0;
                width: 100%;
                padding: 20px;
            }


            .logout {
                position: static;
                margin-top: 20px;
            }


            .stats {
                grid-template-columns: 1fr;
            }


            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }


            .topbar h1 {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>


<div class="layout">


    <!-- ========================================
         SIDEBAR
    ======================================== -->

    <aside class="sidebar">

        <div class="brand">
            Cozy<span>Café</span>
        </div>


        <div class="nav">

            <button
                class="active"
                data-section="dashboard"
            >
                📊 Dashboard
            </button>


            <button
                data-section="orders"
            >
                📦 Orders
            </button>


            <button
                data-section="reservations"
            >
                📅 Reservations
            </button>


            <button
                data-section="customers"
            >
                👥 Customers
            </button>

        </div>


        <div class="logout">

            <button onclick="logout()">
                🚪 Logout
            </button>

        </div>

    </aside>



    <!-- ========================================
         MAIN
    ======================================== -->

    <main class="main">


        <div class="topbar">

            <div>

                <h1 id="pageTitle">
                    Dashboard
                </h1>

                <p>
                    Welcome back, Admin 👋
                </p>

            </div>


            <div class="admin-badge">
                👤 Administrator
            </div>

        </div>


        <div
            id="errorBox"
            class="error"
        ></div>



        <!-- ========================================
             DASHBOARD
        ======================================== -->

        <section
            id="dashboard"
            class="section active"
        >


            <div class="stats">


                <div class="stat-card">

                    <div class="stat-icon">
                        👥
                    </div>

                    <small>
                        Total Customers
                    </small>

                    <strong id="totalCustomers">
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <div class="stat-icon">
                        📦
                    </div>

                    <small>
                        Total Orders
                    </small>

                    <strong id="totalOrders">
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <div class="stat-icon">
                        📅
                    </div>

                    <small>
                        Reservations
                    </small>

                    <strong id="totalReservations">
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <div class="stat-icon">
                        ☕
                    </div>

                    <small>
                        Menu Items
                    </small>

                    <strong id="totalMenuItems">
                        0
                    </strong>

                </div>

            </div>



            <div class="card">

                <div class="card-header">

                    <h2>
                        💰 Total Revenue
                    </h2>

                </div>


                <h1 id="totalRevenue">
                    ₹0
                </h1>

            </div>



            <div class="card">

                <div class="card-header">

                    <h2>
                        Recent Orders
                    </h2>

                    <button
                        class="refresh-btn"
                        onclick="loadOrders()"
                    >
                        Refresh
                    </button>

                </div>


                <div
                    id="recentOrders"
                    class="table-wrap"
                ></div>

            </div>


        </section>



        <!-- ========================================
             ORDERS
        ======================================== -->

        <section
            id="orders"
            class="section"
        >


            <div class="card">

                <div class="card-header">

                    <h2>
                        📦 All Orders
                    </h2>

                    <button
                        class="refresh-btn"
                        onclick="loadOrders()"
                    >
                        Refresh
                    </button>

                </div>


                <div
                    id="ordersTable"
                    class="table-wrap"
                ></div>

            </div>


        </section>



        <!-- ========================================
             RESERVATIONS
        ======================================== -->

        <section
            id="reservations"
            class="section"
        >


            <div class="card">

                <div class="card-header">

                    <h2>
                        📅 Reservations
                    </h2>

                    <button
                        class="refresh-btn"
                        onclick="loadReservations()"
                    >
                        Refresh
                    </button>

                </div>


                <div
                    id="reservationsTable"
                    class="table-wrap"
                ></div>

            </div>


        </section>



        <!-- ========================================
             CUSTOMERS
        ======================================== -->

        <section
            id="customers"
            class="section"
        >


            <div class="card">

                <div class="card-header">

                    <h2>
                        👥 Customers
                    </h2>

                    <button
                        class="refresh-btn"
                        onclick="loadCustomers()"
                    >
                        Refresh
                    </button>

                </div>


                <div
                    id="customersTable"
                    class="table-wrap"
                ></div>

            </div>


        </section>


    </main>

</div>



<script>

    const API = "/api";


    /* ========================================
       HELPERS
    ======================================== */


    function showError(message) {

        const box =
            document.getElementById("errorBox");

        box.textContent = message;

        box.style.display = "block";

    }


    function clearError() {

        const box =
            document.getElementById("errorBox");

        box.textContent = "";

        box.style.display = "none";

    }


    function money(value) {

        return "₹" +
            Number(value || 0).toLocaleString(
                "en-IN"
            );

    }


    function escapeHTML(value) {

        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    /* ========================================
       NAVIGATION
    ======================================== */


    document
        .querySelectorAll(".nav button")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(".nav button")
                        .forEach(btn => {

                            btn.classList.remove(
                                "active"
                            );

                        });


                    button.classList.add(
                        "active"
                    );


                    document
                        .querySelectorAll(".section")
                        .forEach(section => {

                            section.classList.remove(
                                "active"
                            );

                        });


                    const sectionId =
                        button.dataset.section;


                    document
                        .getElementById(sectionId)
                        .classList.add("active");


                    const titles = {

                        dashboard:
                            "Dashboard",

                        orders:
                            "Orders",

                        reservations:
                            "Reservations",

                        customers:
                            "Customers"

                    };


                    document
                        .getElementById("pageTitle")
                        .textContent =
                            titles[sectionId];


                    clearError();


                    if (
                        sectionId ===
                        "dashboard"
                    ) {

                        loadDashboard();

                    }


                    if (
                        sectionId ===
                        "orders"
                    ) {

                        loadOrders();

                    }


                    if (
                        sectionId ===
                        "reservations"
                    ) {

                        loadReservations();

                    }


                    if (
                        sectionId ===
                        "customers"
                    ) {

                        loadCustomers();

                    }

                }
            );

        });



    /* ========================================
       DASHBOARD
    ======================================== */


    async function loadDashboard() {

        try {

            const response =
                await fetch(
                    `${API}/dashboard`
                );


            if (!response.ok) {

                throw new Error(
                    "Dashboard API failed"
                );

            }


            const data =
                await response.json();


            document
                .getElementById(
                    "totalCustomers"
                )
                .textContent =
                    data.totalCustomers ?? 0;


            document
                .getElementById(
                    "totalOrders"
                )
                .textContent =
                    data.totalOrders ?? 0;


            document
                .getElementById(
                    "totalReservations"
                )
                .textContent =
                    data.totalReservations ?? 0;


            document
                .getElementById(
                    "totalMenuItems"
                )
                .textContent =
                    data.totalMenuItems ?? 0;


            await loadRevenue();

            await loadRecentOrders();

            clearError();

        }

        catch (error) {

            console.error(
                "DASHBOARD ERROR:",
                error
            );

            showError(
                "Unable to load dashboard data."
            );

        }

    }



    /* ========================================
       REVENUE
    ======================================== */


    async function loadRevenue() {

        try {

            const response =
                await fetch(
                    `${API}/orders`
                );


            const orders =
                await response.json();


            const total =
                Array.isArray(orders)
                    ? orders.reduce(
                        (
                            sum,
                            order
                        ) => {

                            return sum +
                                Number(
                                    order.total_amount ||
                                    0
                                );

                        },
                        0
                    )
                    : 0;


            document
                .getElementById(
                    "totalRevenue"
                )
                .textContent =
                    money(total);

        }

        catch (error) {

            console.error(
                "REVENUE ERROR:",
                error
            );

        }

    }



    /* ========================================
       RECENT ORDERS
    ======================================== */


    async function loadRecentOrders() {

        try {

            const response =
                await fetch(
                    `${API}/orders`
                );


            if (!response.ok) {

                throw new Error(
                    "Orders API failed"
                );

            }


            const orders =
                await response.json();


            const recent =
                Array.isArray(orders)
                    ? orders.slice(0, 5)
                    : [];


            const container =
                document.getElementById(
                    "recentOrders"
                );


            if (
                recent.length === 0
            ) {

                container.innerHTML =
                    `<div class="message">
                        No orders found.
                    </div>`;

                return;

            }


            container.innerHTML = `

                <table>

                    <thead>

                        <tr>

                            <th>Order</th>
                            <th>Customer</th>
                            <th>Email</th>
                            <th>Total</th>
                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody>

                        ${recent.map(
                            order => `

                            <tr>

                                <td>
                                    ${escapeHTML(
                                        order.order_number
                                    )}
                                </td>

                                <td>
                                    ${escapeHTML(
                                        order.customer_name
                                    )}
                                </td>

                                <td>
                                    ${escapeHTML(
                                        order.customer_email
                                    )}
                                </td>

                                <td>
                                    ${money(
                                        order.total_amount
                                    )}
                                </td>

                                <td>
                                    <span
                                        class="status ${escapeHTML(
                                            order.status
                                        )}"
                                    >
                                        ${escapeHTML(
                                            order.status
                                        )}
                                    </span>
                                </td>

                            </tr>

                        `
                        ).join("")}

                    </tbody>

                </table>

            `;

        }

        catch (error) {

            console.error(
                "RECENT ORDERS ERROR:",
                error
            );

            showError(
                "Unable to load recent orders."
            );

        }

    }



    /* ========================================
       ALL ORDERS
    ======================================== */


    async function loadOrders() {

        try {

            const response =
                await fetch(
                    `${API}/orders`
                );


            if (!response.ok) {

                throw new Error(
                    "Orders API failed"
                );

            }


            const orders =
                await response.json();


            const container =
                document.getElementById(
                    "ordersTable"
                );


            if (
                !Array.isArray(orders) ||
                orders.length === 0
            ) {

                container.innerHTML =
                    `<div class="message">
                        No orders found.
                    </div>`;

                return;

            }


            container.innerHTML = `

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Order Number</th>
                            <th>Customer</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Payment</th>
                            <th>Total</th>
                            <th>Status</th>

                        </tr>

                    </thead>


                    <tbody>

                        ${orders.map(
                            order => `

                            <tr>

                                <td>
                                    ${escapeHTML(
                                        order.id
                                    )}
                                </td>

                                <td>
                                    <strong>
                                        ${escapeHTML(
                                            order.order_number
                                        )}
                                    </strong>
                                </td>

                                <td>
                                    ${escapeHTML(
                                        order.customer_name
                                    )}
                                </td>

                                <td>
                                    ${escapeHTML(
                                        order.customer_email
                                    )}
                                </td>

                                <td>
                                    ${escapeHTML(
                                        order.customer_phone
                                    )}
                                </td>

                                <td>
                                    ${escapeHTML(
                                        order.payment_method
                                    )}
                                </td>

                                <td>
                                    <strong>
                                        ${money(
                                            order.total_amount
                                        )}
                                    </strong>
                                </td>

                                <td>

                                    <select
                                        onchange="updateOrderStatus(
                                            ${Number(order.id)},
                                            this.value
                                        )"
                                    >

                                        ${[
                                            "Pending",
                                            "Confirmed",
                                            "Preparing",
                                            "Ready",
                                            "Completed",
                                            "Cancelled"
                                        ].map(
                                            status => `

                                            <option
                                                value="${status}"
                                                ${
                                                    order.status ===
                                                    status
                                                        ? "selected"
                                                        : ""
                                                }
                                            >
                                                ${status}
                                            </option>

                                        `
                                        ).join("")}

                                    </select>

                                </td>

                            </tr>

                        `
                        ).join("")}

                    </tbody>

                </table>

            `;


            clearError();

        }

        catch (error) {

            console.error(
                "ORDERS ERROR:",
                error
            );

            showError(
                "Unable to load orders."
            );

        }

    }



    /* ========================================
       UPDATE ORDER STATUS
    ======================================== */


    async function updateOrderStatus(
        id,
        status
    ) {

        try {

            const response =
                await fetch(
                    `${API}/orders/${id}/status`,
                    {
                        method: "PATCH",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                status
                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Failed to update order"
                );

            }


            await loadOrders();

            await loadDashboard();

        }

        catch (error) {

            console.error(
                "STATUS ERROR:",
                error
            );

            showError(
                error.message
            );

        }

    }



    /* ========================================
       RESERVATIONS
    ======================================== */


    async function loadReservations() {

        try {

            const response =
                await fetch(
                    `${API}/reservations`
                );


            if (!response.ok) {

                throw new Error(
                    "Reservations API failed"
                );

            }


            const reservations =
                await response.json();


            const container =
                document.getElementById(
                    "reservationsTable"
                );


            if (
                !Array.isArray(
                    reservations
                ) ||
                reservations.length === 0
            ) {

                container.innerHTML =
                    `<div class="message">
                        No reservations found.
                    </div>`;

                return;

            }


            container.innerHTML = `

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Number</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Date</th>
                            <th>Guests</th>
                            <th>Request</th>
                            <th>Status</th>

                        </tr>

                    </thead>


                    <tbody>

                        ${reservations.map(
                            reservation => `

                            <tr>

                                <td>
                                    ${escapeHTML(
                                        reservation.id
                                    )}
                                </td>

                                <td>
                                    ${escapeHTML(
                                        reservation.reservation_number
                                    )}
                                </td>

                                <td>
                                    ${escapeHTML(
                                        reservation.name
                                    )}
                                </td>

                                <td>
                                    ${escapeHTML(
                                        reservation.email
                                    )}
                                </td>

                                <td>
                                    ${escapeHTML(
                                        reservation.reservation_date
                                    )}
                                </td>

                                <td>
                                    ${escapeHTML(
                                        reservation.guests
                                    )}
                                </td>

                                <td>
                                    ${escapeHTML(
                                        reservation.special_request
                                    )}
                                </td>

                                <td>

                                    <select
                                        onchange="updateReservationStatus(
                                            ${Number(
                                                reservation.id
                                            )},
                                            this.value
                                        )"
                                    >

                                        <option
                                            value="Confirmed"
                                            ${
                                                reservation.status ===
                                                "Confirmed"
                                                    ? "selected"
                                                    : ""
                                            }
                                        >
                                            Confirmed
                                        </option>

                                        <option
                                            value="Completed"
                                            ${
                                                reservation.status ===
                                                "Completed"
                                                    ? "selected"
                                                    : ""
                                            }
                                        >
                                            Completed
                                        </option>

                                        <option
                                            value="Cancelled"
                                            ${
                                                reservation.status ===
                                                "Cancelled"
                                                    ? "selected"
                                                    : ""
                                            }
                                        >
                                            Cancelled
                                        </option>

                                    </select>

                                </td>

                            </tr>

                        `
                        ).join("")}

                    </tbody>

                </table>

            `;


            clearError();

        }

        catch (error) {

            console.error(
                "RESERVATIONS ERROR:",
                error
            );

            showError(
                "Unable to load reservations."
            );

        }

    }



    /* ========================================
       UPDATE RESERVATION STATUS
    ======================================== */


    async function updateReservationStatus(
        id,
        status
    ) {

        try {

            const response =
                await fetch(
                    `${API}/reservations/${id}/status`,
                    {
                        method: "PATCH",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                status
                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Failed to update reservation"
                );

            }


            await loadReservations();

            await loadDashboard();

        }

        catch (error) {

            console.error(
                "RESERVATION STATUS ERROR:",
                error
            );

            showError(
                error.message
            );

        }

    }



    /* ========================================
       CUSTOMERS
    ======================================== */


    async function loadCustomers() {

        try {

            const response =
                await fetch(
                    `${API}/users`
                );


            if (!response.ok) {

                throw new Error(
                    "Users API failed"
                );

            }


            const users =
                await response.json();


            const container =
                document.getElementById(
                    "customersTable"
                );


            if (
                !Array.isArray(users) ||
                users.length === 0
            ) {

                container.innerHTML =
                    `<div class="message">
                        No customers found.
                    </div>`;

                return;

            }


            container.innerHTML = `

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Created</th>

                        </tr>

                    </thead>


                    <tbody>

                        ${users.map(
                            user => `

                            <tr>

                                <td>
                                    ${escapeHTML(
                                        user.id
                                    )}
                                </td>

                                <td>
                                    <strong>
                                        ${escapeHTML(
                                            user.name
                                        )}
                                    </strong>
                                </td>

                                <td>
                                    ${escapeHTML(
                                        user.email
                                    )}
                                </td>

                                <td>
                                    ${escapeHTML(
                                        user.created_at
                                    )}
                                </td>

                            </tr>

                        `
                        ).join("")}

                    </tbody>

                </table>

            `;


            clearError();

        }

        catch (error) {

            console.error(
                "CUSTOMERS ERROR:",
                error
            );

            showError(
                "Unable to load customers."
            );

        }

    }



    /* ========================================
       LOGOUT
    ======================================== */


    function logout() {

        window.location.href =
            "/index.html";

    }



    /* ========================================
       INITIAL LOAD
    ======================================== */


    loadDashboard();

</script>


</body>
